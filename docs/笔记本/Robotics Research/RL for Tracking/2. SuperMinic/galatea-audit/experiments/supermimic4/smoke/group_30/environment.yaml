train:
  params:
    seed: ${...seed}
    algo:
      name: block_ppo
    model:
      name: block_policy
    network:
      name: asymmetric_mlp
      space:
        continuous:
          mu_activation: None
          sigma_activation: None
          mu_init:
            name: default
          sigma_init:
            name: const_initializer
            val: 0
          fixed_sigma: true
      mlp:
        units:
        - 1024
        - 1024
        - 512
        - 512
        activation: elu
        initializer:
          name: default
      actor_feature_encoder:
        _target_: armhand.rl.features.Identity
        input_dim: 323
      critic_feature_encoder:
        _target_: armhand.rl.features.DictFeatureConcat
        extractors:
          privileged:
            _target_: armhand.rl.features.Identity
            input_dim: 66
          proprioception:
            _target_: armhand.rl.features.Identity
            input_dim: 129
          target:
            _target_: armhand.rl.features.Identity
            input_dim: 450
    config:
      name: ${....experiment}
      full_experiment_name: null
      env_name: isaac_env
      multi_gpu: ${....multi_gpu}
      mixed_precision: true
      normalize_input_excluded_keys:
      - block_coef
      num_actors: ${....num_envs}
      reward_shaper:
        scale_value: 0.01
      gamma: 0.99
      tau: 0.95
      learning_rate: 0.0001
      lr_schedule: adaptive
      kl_threshold: 0.016
      adaptive_lr_min: 1.0e-05
      adaptive_lr_max: 0.001
      score_to_win: 1.0e+30
      max_epochs: ${....max_iterations}
      early_stop_epochs: 32002
      save_best_after: 2
      save_frequency: 250
      print_stats: true
      grad_norm: 1.0
      entropy_coef: 0.002
      e_clip: 0.1
      clip_value: true
      horizon_length: 24
      minibatch_size: ${....minibatch_size}
      mini_epochs: 2
      critic_coef: 4.0
      seq_length: 16
      bounds_loss_coef: 0.0001
      frame0_eval_interval: 250
      frame0_eval_max_steps: 2000
      blocks:
        num_blocks: 6
        coefficient_max: 50.0
        coefficient_min: 0.0
        entropy_scale: 0.005
        off_policy_repeats: 1
        embedding_dim: 32
        eval_coefficient: 0.0
task:
  name: ArmHandTrack
  seed: ${..seed}
  env:
    numEnvs: ${...num_envs}
    episodeLength: 2000
    controlFrequencyInv: 2
    clipActions: 1.0
    dataDir: ${...object.data_dir}
    ikDir: ${...object.ik_dir}
    dataIndices: ${...object.data_indices}
    handSelfCollision: ${...object.hand_self_collision}
    referenceFps: 60.0
    floorLiftFps: 30.0
    tableSurfaceZ: 0.415
    robotUrdf: assets/robot/fr3_sharpa_right.urdf
    robotBasePos:
    - 0.0
    - 0.95
    - 0.0
    robotBaseYaw: -1.5707963267948966
    armActionScale: 0.03
    armSmoothing: 0.2
    armJointMarginDeg: 10.0
    handSmoothing: 0.1
    handTargetDeadband: 0.01
    metalFriction: 0.4
    padFriction: 1.0
    objectPosNoise: 0.008
    objectRotNoiseDeg: 5.0
    gravityRampSteps: 1920
    gravityUpdateInterval: 32
    gravityInitialScale: 1.0
    randomStateInit: true
    resetFrameFraction: 0.98
    failureTolerance: 2.0
    tightenFactor: 0.7
    tightenSteps: 3200
    tightenSchedule: const
    handActionMask:
      probability: 0.15
      joints: 3
      startMaxSteps: 1
      endMaxSteps: 10
      curriculumSteps: 25600
      sigmaMin: 0.7
    physicsRandomization:
      handPdScale:
      - 0.8
      - 1.2
      armPdScale:
      - 0.8
      - 1.2
      surfaceFrictionScale:
      - 0.5
      - 1.5
      objectFriction:
      - 0.1
      - 0.2
      tableFriction:
      - 0.1
      - 0.2
      objectMass:
      - 0.02
      - 0.1
    reward:
      wristPos: 0.1
      wristRot: 3.0
      wristRotSharpness: 1.91
      level1: 0.5
      level2: 0.3
      freeSpaceDistance: 0.02
      freeSpaceFingerScale: 2.0
      contactFingerScale: 0.75
      objectContactDistance: 0.005
      lift: 3.0
      liftHeight: 0.05
      armActionRate: 0.05
      handActionRate: 0.025
      padContact:
        forceThreshold: 0.1
        distance: 0.015
        surfaceSamples: 128
      multiFingerContact:
        scale: 0.5
        four: 2.5
        five: 5.0
        warmupSteps: 2
      padDistance:
        scale: 2.5
        tolerance: 0.015
        sigma: 0.02
        minReferenceContacts: 1
        warmupSteps: 2
      handVelocity:
        scale: 0.04
        referenceFraction: 0.15
        max: 1.0
        warmupSteps: 2
        terminateFraction: 0.35
        terminateWarmupSteps: 2
        unlockSuccessRate: 0.5
      armVelocity:
        scale: 0.1
        referenceFraction: 0.15
        max: 1.0
        terminateFraction: 0.15
        warmupSteps: 2
      torque:
        scale: 0.2222222
        deadzone: 0.2
        max: 0.2222222
  sim:
    dt: 0.016666666666666666
    substeps: 2
    gravity:
    - 0.0
    - 0.0
    - -9.81
    physx:
      num_threads: 4
      solver_type: 1
      use_gpu: true
      num_position_iterations: 8
      num_velocity_iterations: 0
      contact_offset: 0.002
      rest_offset: 0.0
      bounce_threshold_velocity: 0.2
      max_depenetration_velocity: 1.0
      default_buffer_size_multiplier: 25.0
      max_gpu_contact_pairs: 8388608
      num_subscenes: 4
      contact_collection: 1
